<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Booking Confirmed</title>
    <link rel="stylesheet" href="/css/thankyou.css" />
</head>

<body>

    <main class="thank-you-container">
        <div class="thank-you-card">
            <div class="icon">✓</div>

            <h1>Thank You!</h1>
            <p class="subtitle">
                Your session has been successfully scheduled.
            </p>

            <p class="info">
                We will reach out using the contact details you provided.
                Please keep an eye on your email or WhatsApp.
            </p>

            <p class="redirect-text">
                You will be redirected shortly…
            </p>

            <a href="/" class="btn-primary">Go Now</a>
        </div>
    </main>

    <script>
        // Redirect after X seconds
        const REDIRECT_DELAY = 7000; // 5 seconds
        const REDIRECT_URL = "/";   // change to dashboard or homepage

        setTimeout(() => {
            window.location.href = REDIRECT_URL;
        }, REDIRECT_DELAY);

    </script>
</body>

</html>
